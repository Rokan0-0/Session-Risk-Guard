<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Session Risk Guard — Even G2</title>
    <style>
      :root {
        --bg: #121216;
        --surface: #1c1c22;
        --surface-2: #25252d;
        --border: #343440;
        --text: #e8eaed;
        --muted: #9ca3af;
        --green: #00ff66;
        --g2-bg: #040b06;
        --g2-border: #175c2e;
        --red: #ff4d4f;
        --amber: #f59e0b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        max-width: 1040px;
        margin: 0 auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }
      .title-wrap h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(0, 255, 102, 0.12);
        color: var(--green);
        border: 1px solid rgba(0, 255, 102, 0.35);
      }
      .badge.alert {
        background: rgba(255, 77, 79, 0.16);
        color: #ff787a;
        border-color: rgba(255, 77, 79, 0.5);
      }
      .badge.confirm {
        background: rgba(245, 158, 11, 0.16);
        color: #fbbf24;
        border-color: rgba(245, 158, 11, 0.5);
      }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
        gap: 12px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
      }
      .card h2 {
        margin: 0 0 10px 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      /* 576x288 Monochrome Even G2 Mirror */
      .g2-shell {
        background: #090c0a;
        border: 1px solid var(--g2-border);
        border-radius: 10px;
        padding: 10px;
      }
      .g2-screen {
        width: 100%;
        max-width: 576px;
        aspect-ratio: 2 / 1;
        margin: 0 auto;
        background: var(--g2-bg);
        border: 1px solid #1e7c3d;
        border-radius: 6px;
        padding: 8px;
        display: grid;
        grid-template-rows: 44fr 116fr 120fr;
        gap: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--green);
        box-shadow: inset 0 0 24px rgba(0, 255, 102, 0.06);
      }
      .g2-box {
        border: 1px solid rgba(0, 255, 102, 0.45);
        padding: 4px 8px;
        overflow: hidden;
      }
      .g2-header {
        display: flex;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .g2-body {
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        display: flex;
        align-items: center;
      }
      .g2-actions {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        padding: 3px 6px;
        overflow-y: auto;
      }
      .g2-action-btn {
        width: 100%;
        text-align: left;
        background: rgba(0, 255, 102, 0.06);
        border: 1px solid rgba(0, 255, 102, 0.35);
        color: var(--green);
        font-family: inherit;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 1.25;
        padding: 2px 7px;
        border-radius: 4px;
        cursor: pointer;
      }
      .g2-action-btn:hover {
        background: rgba(0, 255, 102, 0.18);
        border-color: var(--green);
      }
      .g2-action-btn.primary-opt {
        background: rgba(0, 255, 102, 0.18);
        border-color: var(--green);
      }

      .ticker-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        font-variant-numeric: tabular-nums;
      }
      .ticker-row:last-child { border-bottom: none; }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 10px;
      }
      .stat-pill {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .stat-label { font-size: 11px; color: var(--muted); }
      .stat-val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
      .safety-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,0.06);
      }
      .transfer-bar {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 0;
        border-top: 1px solid rgba(255,255,255,0.06);
      }
      .transfer-custom {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 8px;
      }
      .pos-card {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .pos-card:hover { border-color: rgba(0, 255, 102, 0.55); }
      .pos-card.active { border-color: var(--green); }
      .pos-card.alerted { border-color: var(--red); }
      .pos-top {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        margin-bottom: 4px;
        gap: 8px;
      }
      .venue-tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(255,255,255,0.08);
        color: #d1d5db;
        margin-right: 6px;
      }
      .pos-meta {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .pnl-pos { color: var(--green); }
      .pnl-neg { color: var(--red); }
      .pnl-warn { color: var(--amber); }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      button:hover { border-color: var(--green); }
      button.danger {
        border-color: rgba(255, 77, 79, 0.5);
        color: #ff8082;
      }
      button.danger:hover { background: rgba(255, 77, 79, 0.15); }
      button.amber {
        border-color: rgba(245, 158, 11, 0.55);
        color: #fbbf24;
      }
      button.amber:hover { background: rgba(245, 158, 11, 0.14); }
      button.primary {
        background: rgba(0, 255, 102, 0.14);
        border-color: rgba(0, 255, 102, 0.45);
        color: var(--green);
      }
      button.chip {
        padding: 4px 9px;
        font-size: 11px;
        border-radius: 999px;
      }
      button.chip.active-tab {
        background: rgba(0, 255, 102, 0.15);
        border-color: var(--green);
        color: var(--green);
      }
      .voice-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 8px;
        margin-bottom: 8px;
      }
      .alert-form {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto;
        gap: 8px;
        margin-top: 8px;
      }
      .alert-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        background: var(--surface-2);
        border-radius: 6px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .alert-row.hit {
        border: 1px solid rgba(255, 77, 79, 0.6);
        color: #ff9c9e;
      }
      .log-list {
        max-height: 200px;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .log-item {
        padding: 6px 8px;
        background: var(--surface-2);
        border-radius: 6px;
        border-left: 3px solid var(--green);
      }
      .log-item.warn { border-left-color: var(--amber); }
      .log-item.alert { border-left-color: var(--red); }
      .testnet-row {
        display: grid;
        grid-template-columns: 1fr 1fr auto auto;
        gap: 8px;
        margin-top: 8px;
      }
      input, select {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 12px;
        width: 100%;
      }
      label.inline-check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }
      label.inline-check input {
        width: auto;
      }
      @media (max-width: 680px) {
        .testnet-row, .alert-form, .voice-row, .stat-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app">Initializing Session Risk Guard...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
